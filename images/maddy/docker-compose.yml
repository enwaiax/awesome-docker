version: '3.9'
services:
  maddy:
    image: enwaiax/maddy:0.9.5
    container_name: maddy
    restart: unless-stopped
    environment:
      - MADDY_HOSTNAME=$MADDY_HOSTNAME
      - MADDY_DOMAIN=$MADDY_DOMAIN
    volumes:
      - maddydata:/data
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  maddydata:
    driver: local
    name: maddydata
