services:
  aria2:
    image: p3terx/aria2-pro:latest
    restart: unless-stopped
    environment:
      PUID: ${PUID:-65534}
      PGID: ${PGID:-65534}
      UMASK_SET: "022"
      RPC_SECRET: ${ARIA2_RPC_SECRET:?set ARIA2_RPC_SECRET}
      RPC_PORT: "6800"
      LISTEN_PORT: "6888"
      DISK_CACHE: 64M
      IPV6_MODE: "false"
      UPDATE_TRACKERS: "true"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./aria2-config:/config
      - ./downloads:/downloads
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  download-bot:
    image: enwaiax/download-bot:latest
    restart: unless-stopped
    depends_on:
      - aria2
    volumes:
      - ./config.json:/root/config.json:ro
      - ./downloads:/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
