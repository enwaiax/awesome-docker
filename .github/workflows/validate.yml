name: Validate website and docs

on:
  pull_request:
    paths:
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/builder.yaml'
      - '.github/workflows/image-build.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - 'docs/image-guide-template.md'
      - 'scripts/validate-image-guides.py'
      - 'images/maddy/**'
      - 'images/download-bot/**'
      - 'images/netease-cloud-music-tasks/**'
      - 'images/x-ui/**'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '**/*.md'
      - '.github/workflows/validate.yml'
      - '.github/workflows/builder.yaml'
      - '.github/workflows/image-build.yml'
      - 'images/maddy/**'
      - 'images/download-bot/**'
      - 'images/netease-cloud-music-tasks/**'
      - 'images/x-ui/**'

permissions:
  contents: read

jobs:
  image-guides:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate image guide contract
        run: python3 scripts/validate-image-guides.py

  dockerfiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [maddy, download-bot, netease-cloud-music-tasks, x-ui]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Validate Dockerfile
        uses: hadolint/hadolint-action@v3.4.0
        with:
          dockerfile: images/${{ matrix.project }}/Dockerfile
          failure-threshold: error
          ignore: DL3020

      - name: Build AMD64 image from new location
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          image="awesome-docker-ci/${PROJECT}"
          docker buildx build --load --tag "$image:ci" "images/${PROJECT}"
          docker image inspect "$image:ci" --format '{{.Os}}/{{.Architecture}}' > image.txt
          cat image.txt
          grep -q '^linux/amd64$' image.txt

      - name: Validate Compose file
        if: hashFiles(format('images/{0}/docker-compose.yml', matrix.project)) != ''
        env:
          ARIA2_RPC_SECRET: ci-validation-only
          MADDY_HOSTNAME: mx.example.test
          MADDY_DOMAIN: example.test
        run: docker compose -f "images/${{ matrix.project }}/docker-compose.yml" config -q

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository-owned Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept '200..=299,403,429'
            --exclude 'localhost|127\.0\.0\.1|服务器IP|ip/|xn--ip|starchart\.cc/.+\.svg|github\.com/enwaiax/awesome-docker/tree/main/images/'
            README.md
            CONTRIBUTING.md
            SECURITY.md
            docs/image-publishing.md
            images/download-bot/README.md
            images/maddy/README.md
            images/maddy/rainloop/README.md
            images/netease-cloud-music-tasks/README.md
            images/x-ui/README.md
            images/x-ui/docs/README_en.md
          fail: true
